services:

  backend:
    build: ./backend
    container_name: search-savor-backend
    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: search-savor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend