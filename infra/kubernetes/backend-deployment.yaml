apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: search-savor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: search-and-savor-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: search-savor-secrets