
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token-requester
  namespace: search-savor
rules:
  - apiGroups: [""]
    resources:
      - serviceaccounts/token
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token-requester
  namespace: search-savor
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager 
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-token-requester
