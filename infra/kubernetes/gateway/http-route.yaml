apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search-savor-route
  namespace: search-savor
  labels:
    app.kubernetes.io/name: search-savor
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: search-savor-gateway
      namespace: search-savor
      sectionName: https

  hostnames:
    - search-savor.test

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 120s
        backendRequest: 110s
      backendRefs:
        - group: ""
          kind: Service
          name: frontend
          port: 80
          weight: 1