apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search-savor-certificate
  namespace: search-savor
spec:
  secretName: search-savor-tls
  issuerRef:
    name: search-savor-vault-issuer
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - search-savor.test
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth