apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: search-savor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: search-and-savor-frontend:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80