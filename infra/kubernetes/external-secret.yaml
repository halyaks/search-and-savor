apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-savor-api-key
  namespace: search-savor

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: search-savor-secrets
    creationPolicy: Owner

  data:
    - secretKey: YOUTUBE_API_KEY
      remoteRef:
        key: search-savor/youtube
        property: API_KEY